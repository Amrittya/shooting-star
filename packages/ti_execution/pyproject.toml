[project]
name = "ti-execution"
version = "0.1.0"
description = "Shooting Star — order routing, broker adapters (interim PykiteBroker, eventual Rust nautilus-kite), retry, reconciliation."
requires-python = ">=3.12,<3.14"
dependencies = [
    "ti-core",
    "ti-risk",
    "kiteconnect>=5.2.0",
    "tenacity>=9.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ti_execution"]
