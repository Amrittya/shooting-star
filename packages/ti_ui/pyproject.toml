[project]
name = "ti-ui"
version = "0.1.0"
description = "Shooting Star — CLI + FastAPI dashboard."
requires-python = ">=3.12,<3.14"
dependencies = [
    "ti-core",
    "ti-data",
    "ti-strategy",
    "ti-risk",
    "ti-execution",
    "ti-backtest",
    "typer>=0.26.0",
    "rich>=15.0.0",
    "fastapi>=0.139.0",
    "uvicorn[standard]>=0.49.0",
]

[project.scripts]
shooting-star = "ti_ui.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ti_ui"]
