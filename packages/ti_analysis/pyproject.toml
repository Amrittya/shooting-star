[project]
name = "ti-analysis"
version = "0.1.0"
description = "Shooting Star — technical + fundamental analysis, options greeks, IV surface features."
requires-python = ">=3.12,<3.14"
dependencies = [
    "ti-core",
    "pandas>=3.0.0",
    "numpy>=2.5.0",
    "scipy>=1.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ti_analysis"]
