[project]
name = "ti-ml"
version = "0.1.0"
description = "Shooting Star — classical ML: meta-labeling, regime classification, HAR-RV vol forecast."
requires-python = ">=3.12,<3.14"
dependencies = [
    "ti-core",
    "ti-data",
    "pandas>=3.0.0",
    "numpy>=2.5.0",
    "scikit-learn>=1.9.0",
    "xgboost>=3.3.0",
    "scipy>=1.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ti_ml"]
