[project]
name = "ti-agents"
version = "0.1.0"
description = "Shooting Star — L1/L2/L3 LLM/agentic layer. Out-of-band; never in order-placement hot path."
requires-python = ">=3.12,<3.14"
dependencies = [
    "ti-core",
    "ti-data",
    "ti-strategy",
    "anthropic>=0.115.0",
    "claude-agent-sdk>=0.2.110",
    "pydantic>=2.13.0",
    "httpx>=0.28.0",
    "feedparser>=6.0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ti_agents"]
