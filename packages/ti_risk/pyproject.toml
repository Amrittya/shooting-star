[project]
name = "ti-risk"
version = "0.1.0"
description = "Shooting Star — deterministic risk engine (pre-trade checks, charges, kill switches, stress test)."
requires-python = ">=3.12,<3.14"
dependencies = [
    "ti-core",
    "ti-data",
    "pandas>=3.0.0",
    "numpy>=2.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ti_risk"]
