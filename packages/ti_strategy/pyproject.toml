[project]
name = "ti-strategy"
version = "0.1.0"
description = "Shooting Star — strategy framework + concrete strategies."
requires-python = ">=3.12,<3.14"
dependencies = [
    "ti-core",
    "ti-data",
    "ti-analysis",
    "pandas>=3.0.0",
    "numpy>=2.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ti_strategy"]
