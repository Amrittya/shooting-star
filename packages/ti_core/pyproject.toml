[project]
name = "ti-core"
version = "0.1.0"
description = "Shooting Star — shared domain types, config, logging, event bus."
requires-python = ">=3.12,<3.14"
dependencies = [
    "pydantic>=2.13.0",
    "pydantic-settings>=2.14.0",
    "structlog>=26.1.0",
    "redis>=8.0.0",
    "python-dateutil>=2.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ti_core"]
