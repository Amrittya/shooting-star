[project]
name = "ti-data"
version = "0.1.0"
description = "Shooting Star — data ingestion, storage (Parquet/DuckDB/SQLite), serving."
requires-python = ">=3.12,<3.14"
dependencies = [
    "ti-core",
    "duckdb>=1.5.0",
    "pyarrow>=24.0.0",
    "pandas>=3.0.0",
    "polars>=1.42.0",
    "sqlalchemy[asyncio]>=2.0.50",
    "aiosqlite>=0.22.0",
    "kiteconnect>=5.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ti_data"]
