[project]
name = "shooting-star"
version = "0.1.0"
description = "Semi-autonomous trading intelligence engine for Indian markets (NSE/BSE) — NIFTY/BANKNIFTY options + cash equities via Zerodha."
requires-python = ">=3.12,<3.14"
readme = "README.md"
license = { text = "Proprietary" }
authors = [
    { name = "Amrittya", email = "amrittya.aakash.aswal@sap.com" },
]

# Top-level package is a thin CLI shim; real work lives in packages/ti_*.
dependencies = [
    "ti-core",
    "ti-data",
    "ti-strategy",
    "ti-analysis",
    "ti-backtest",
    "ti-risk",
    "ti-execution",
    "ti-ml",
    "ti-agents",
    "ti-ui",
]

[project.scripts]
shooting-star = "ti_ui.cli.main:app"

# ---------------------------------------------------------------------------
# uv workspace — each packages/ti_* is a member with its own pyproject.toml
# ---------------------------------------------------------------------------
[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
ti-core = { workspace = true }
ti-data = { workspace = true }
ti-strategy = { workspace = true }
ti-analysis = { workspace = true }
ti-backtest = { workspace = true }
ti-risk = { workspace = true }
ti-execution = { workspace = true }
ti-ml = { workspace = true }
ti-agents = { workspace = true }
ti-ui = { workspace = true }

[tool.uv]
# Override vulnerable transitive deps pinned by upstream packages.
# See docs/adr/adr-0005-vuln-overrides.md for rationale.
override-dependencies = [
    # kiteconnect==5.2.0 pins autobahn==19.11.2 (PYSEC-2020-25). Force upgrade.
    "autobahn>=22.7.1",
]

[dependency-groups]
dev = [
    "ruff>=0.15.20",
    "mypy>=2.1.0",
    "pytest>=9.1.0",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=6.0.0",
    "pip-audit>=2.9.0",
    "types-requests",
    "hypothesis>=6.155.0",
    "freezegun>=1.5.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Top-level shim has no code — just the workspace metadata.
packages = []
bypass-selection = true

# ---------------------------------------------------------------------------
# Ruff — one config for the whole monorepo
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "data", "logs", "rust/target"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
    "PL",   # pylint
    "RUF",  # ruff-specific
    "S",    # flake8-bandit (security)
    "PTH",  # flake8-use-pathlib
    "TCH",  # flake8-type-checking
    "ASYNC",# flake8-async
    "DTZ",  # flake8-datetimez (timezone awareness — critical for trading)
]
ignore = [
    "E501",     # line-too-long — ruff format handles this
    "PLR0913",  # too-many-arguments — trading code has legitimate wide signatures
    "PLR2004",  # magic-value — false positives on price / strike literals
    "S101",     # assert — we use asserts liberally in bias guards
    "S311",     # random — non-cryptographic random is fine for backtests
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "PLR2004", "ARG"]
"**/__init__.py" = ["F401", "F403"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# Mypy — strict across the monorepo
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
show_column_numbers = true
pretty = true
exclude = ["build/", "dist/", ".venv/", "data/", "rust/"]

[[tool.mypy.overrides]]
# Third-party libs without type stubs
module = [
    "kiteconnect.*",
    "duckdb.*",
    "vectorbt.*",
    "nautilus_trader.*",
    "pandas_ta.*",
    "hmmlearn.*",
    "arch.*",
]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["packages"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
    "-q",
]
markers = [
    "slow: tests that take >1s (deselect with '-m \"not slow\"')",
    "integration: tests requiring external services",
    "requires_kite: tests requiring live Kite Connect API",
]
asyncio_mode = "auto"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:nautilus_trader.*",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
branch = true
source = ["packages"]
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == \"__main__\":",
]
